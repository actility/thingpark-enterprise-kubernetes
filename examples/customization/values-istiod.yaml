global:
  # Update the image repository for Istio components when using a private registry
  hub: repository.thingpark.com/istio
  imagePullSecrets:
    - "thingpark-image-pull-secret"
gatewayClasses:
  istio:
    deployment:
      spec:
        replicas: 2
pilot:
  env:
    PILOT_ENABLE_ALPHA_GATEWAY_API: true
